{% for k, v in keep_sizes %}<input type="hidden" name="{{ k }}" value="{{ v }}" data-keep-page-size>{% endfor %}<span class="filter-actions" data-filter-actions>{% if apply %}<button class="button primary" type="submit">Apply</button>{% endif %}<a class="button secondary" href="{{ clear_url }}" data-filter-clear>Clear</a></span>{% if items %}<p class="filter-summary" data-filter-summary><b>Filtered:</b> {% for key, label, value in items %}<span data-filter-key="{{ key }}">{{ label }}: {{ value }}</span>{% if not forloop.last %} &middot; {% endif %}{% endfor %}</p>{% endif %}
