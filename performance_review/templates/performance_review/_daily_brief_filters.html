{% load filter_ui %}<form method="get" class="qb-filter-form panel pr-filters daily-brief-filters" data-filter-form>
  {% include 'invoice_app/_standard_period_filter.html' %}
  {% if week_prev_url and week_next_url %}
  <span class="compact-filter-label daily-brief-week-nav"><span>Week</span>
    <span class="segmented" aria-label="Week navigation">
      <a href="{{ week_prev_url }}">Previous</a>
      <a href="{{ week_next_url }}">Next</a>
    </span>
  </span>
  {% endif %}
  <label>Recruiter
    <select class="field" name="recruiter" data-combo="daily-brief-recruiter-filter"><option value="">All recruiters</option>{% for employee in recruiters %}<option value="{{ employee.pk }}"{% if selected_recruiter == employee.pk|stringformat:'s' %} selected{% endif %}>{{ employee.employee_id }} — {{ employee.full_name }}</option>{% endfor %}</select>
  </label>
  <label>Search recruiter <input class="field" type="search" name="recruiter_search" value="{{ recruiter_search }}" placeholder="Name or employee ID"></label>
  <label>Search JD Number <input class="field" type="search" name="jd_search" value="{{ jd_search }}" placeholder="e.g. 07-01"></label>
  
  {% filter_actions %}
  <span class="muted daily-brief-period-label">Showing {{ period.label }}</span>
</form>
