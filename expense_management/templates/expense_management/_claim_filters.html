<form class="panel filters compact-filters" method="get"><input class="field" name="q" value="{{ params.q }}" placeholder="Claim ID, employee, description">
<select class="field" name="employee"><option value="">All employees</option>{% for e in employees_all %}<option value="{{ e.pk }}" {% if params.employee == e.pk|stringformat:"s" %}selected{% endif %}>{{ e.employee_id }} {{ e.full_name }}</option>{% endfor %}</select>
<select class="field" name="department"><option value="">All departments</option>{% for d in departments_all %}<option value="{{ d.pk }}" {% if params.department == d.pk|stringformat:"s" %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select>
<select class="field" name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c.pk }}" {% if params.category == c.pk|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select>
<select class="field" name="status"><option value="">Any status</option><option value="pending" {% if params.status == 'pending' %}selected{% endif %}>Pending (submitted / under review)</option>{% for k, l in statuses %}<option value="{{ k }}" {% if params.status == k %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
<label class="compact-filter-label compact-date-range"><span>Claim date</span><input class="field" type="date" name="claim_date_from" value="{{ params.claim_date_from }}" aria-label="Claim date from"> &ndash; <input class="field" type="date" name="claim_date_to" value="{{ params.claim_date_to }}" aria-label="Claim date to"></label>
<label class="compact-filter-label compact-date-range"><span>Expense date</span><input class="field" type="date" name="expense_date_from" value="{{ params.expense_date_from }}" aria-label="Expense date from"> &ndash; <input class="field" type="date" name="expense_date_to" value="{{ params.expense_date_to }}" aria-label="Expense date to"></label>
<button class="button secondary" type="submit">Filter</button><a href="?status=">Reset</a></form>
