<select class="field" name="category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c.pk }}" {% if params.category == c.pk|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select>
<select class="field" name="vendor"><option value="">All vendors</option>{% for v in vendors_all %}<option value="{{ v.pk }}" {% if params.vendor == v.pk|stringformat:"s" %}selected{% endif %}>{{ v.name }}</option>{% endfor %}</select>
<select class="field" name="employee"><option value="">All employees</option>{% for e in employees_all %}<option value="{{ e.pk }}" {% if params.employee == e.pk|stringformat:"s" %}selected{% endif %}>{{ e.employee_id }} {{ e.full_name }}</option>{% endfor %}</select>
<select class="field" name="department"><option value="">All departments</option>{% for d in departments_all %}<option value="{{ d.pk }}" {% if params.department == d.pk|stringformat:"s" %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select>
