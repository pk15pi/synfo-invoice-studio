{% load filter_ui %}<form method="get" class="qb-filter-form panel" data-filter-form>{% if extra_hidden %}{{ extra_hidden }}{% endif %}<label class="compact-filter-label"><span>Month</span><select class="field" name="month">{% for n, l in months %}<option value="{{ n }}" {% if n == m %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
<label class="compact-filter-label"><span>Year</span><select class="field" name="year">{% for yy in years %}<option {% if yy == y %}selected{% endif %}>{{ yy }}</option>{% endfor %}</select></label> {% filter_actions %}</form>
