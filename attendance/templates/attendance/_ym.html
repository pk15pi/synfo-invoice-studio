<form method="get" class="panel">{% if extra_hidden %}{{ extra_hidden }}{% endif %}<select class="field" name="month">{% for n, l in months %}<option value="{{ n }}" {% if n == m %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
<select class="field" name="year">{% for yy in years %}<option {% if yy == y %}selected{% endif %}>{{ yy }}</option>{% endfor %}</select> <button class="button secondary">Show</button></form>
