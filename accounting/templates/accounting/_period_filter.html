<label class="compact-filter-label"><span>Date range</span><select class="field" name="period" onchange="const f=this.form;if(this.value!=='fy')f.elements.fy.value='';if(this.value!=='month')f.elements.month.value='';if(this.value!=='custom'){f.elements.date_from.value='';f.elements.date_to.value='';}">{% for k, l in periods %}<option value="{{ k }}" {% if f.key == k %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
<label class="compact-filter-label"><span>Financial year</span><select class="field" name="fy" onchange="if(this.value){this.form.elements.period.value='';this.form.elements.month.value='';this.form.elements.date_from.value='';this.form.elements.date_to.value='';}"><option value="">Any FY</option>{% for y, l in fy_list %}<option value="{{ y }}" {% if params.fy == y|stringformat:"s" %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
<label class="compact-filter-label"><span>Month</span><select class="field" name="month" onchange="if(this.value){this.form.elements.period.value='';this.form.elements.fy.value='';this.form.elements.date_from.value='';this.form.elements.date_to.value='';}"><option value="">Any month</option>{% for value, label in month_choices %}<option value="{{ value }}" {% if params.month == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label class="compact-filter-label"><span>From</span><input class="field" type="date" name="date_from" value="{{ params.date_from }}" onchange="if(this.value){this.form.elements.period.value='';this.form.elements.fy.value='';this.form.elements.month.value='';}"></label>
<label class="compact-filter-label"><span>To</span><input class="field" type="date" name="date_to" value="{{ params.date_to }}" onchange="if(this.value){this.form.elements.period.value='';this.form.elements.fy.value='';this.form.elements.month.value='';}"></label>
